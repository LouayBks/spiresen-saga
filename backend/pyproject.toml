[project]
name = "saga-backend"
version = "0.1.0"
description = "FastAPI backend for the Saga box-canvas app, deployed via Mangum on Lambda"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "mangum==0.22.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]==0.53.0",
    "ruff==0.16.7",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-randomly==5.0.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN", "BLE", "D", "PLR0915", "C901"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Strict mode is for app code (CC-5); httpx's TestClient exposes partially-untyped
# members that strict mode flags with no actionable fix on our side.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
