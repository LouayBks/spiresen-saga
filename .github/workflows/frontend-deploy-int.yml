name: frontend-deploy-int

# Same shape as frontend-deploy.yml, targeting int — deliberately unprotected (no
# required-reviewer gate), matching infra-deploy-int.yml's apply job: int is the
# fast-iteration environment, gated only by the existing required PR review to merge
# into int, not by an extra approval click on every deploy.

on:
  push:
    branches: [int]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy-int.yml"

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  AWS_REGION: "eu-west-3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: int # unprotected — variable scoping only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws s3 sync dist/frontend/browser/ s3://${{ vars.STATIC_SITE_BUCKET_NAME }}/ --delete
      - run: aws cloudfront create-invalidation --distribution-id ${{ vars.STATIC_SITE_DISTRIBUTION_ID }} --paths "/*"
