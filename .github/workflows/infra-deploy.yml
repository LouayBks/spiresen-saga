name: infra-deploy

# AW-24 (DOC/architecture/branching_strategy.md): plan on PR, apply only on push to
# main, no workflow_dispatch — nothing in this file gives Claude (or anyone) a way to
# trigger an apply outside a human-merged PR into main.

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"

permissions:
  id-token: write # required for GitHub OIDC -> AWS role assumption
  contents: read
  pull-requests: write # plan job comments the plan output on the PR

defaults:
  run:
    working-directory: infra/environments/prod

env:
  TF_VERSION: "1.11.2"
  AWS_REGION: "eu-west-3" # stack's primary region (Paris); ACM's forced us-east-1 is handled inside Terraform via a provider alias, not here

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/prod/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan — infra/environments/prod\n\`\`\`\n${plan}\n\`\`\``,
            });

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod # requires the "prod" GitHub Environment to exist for this to gate on required reviewers
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
