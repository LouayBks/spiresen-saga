# On-demand counterpart to claude-review.yml's automatic per-PR-event
# review. Implements the "@claude / on PR event" interactive-mode entry
# point named in DOC/architecture/agentic_workflow_processes.md section D
# ("Review workflow ('gh claude')") — only the automatic half of that node
# existed until now.
#
# Trigger: a PR comment (issue_comment) or review-line comment
# (pull_request_review_comment) that starts with "/review" runs the same
# local /code-review pass as the automatic workflow, on demand. The job's
# `if:` does that matching. claude-code-action's own trigger_phrase can't:
# with a fixed `prompt:` the action runs in automation mode and ignores
# trigger_phrase, so before this gate every owner comment on a PR started
# a full review (86 runs on 2026-10-15 from thread replies on #70). The
# match is startsWith, not contains, so a comment that only mentions
# "/review" doesn't start a run.
#
# issue_comment always runs this file as it is on the default branch
# (main); pull_request_review_comment runs it from the PR's merge ref. A
# change here covers top-level PR comments only once it reaches main.
#
# The action does NOT check out the repo itself (the action's first
# `git diff` failed with "Not a git repository" until an explicit checkout
# step was added below).
#
# Two safety gates issue_comment needs that pull_request (used by
# claude-review.yml) gets for free from GitHub itself:
#
# 1. Secrets exposure: `pull_request` withholds repo secrets from fork PRs
#    automatically; `issue_comment` does not — it always runs in the base
#    repo's context with full secrets, regardless of whose PR is being
#    commented on. Since this repo is public, anyone could otherwise spend
#    the repo owner's Claude Code OAuth usage by commenting "/review" on
#    any PR. Gated below by requiring the commenter's author_association
#    to be OWNER/COLLABORATOR/MEMBER.
# 2. Untrusted diff content: even a trusted commenter can type "/review" on
#    someone else's fork PR. Checking out that fork's head and handing its
#    diff to an action with pull-requests:write/issues:write is the classic
#    "pwn request" shape (attacker-controlled content reviewed by a job
#    that can act with write permissions) — the same reason claude-review.yml
#    skips fork PRs entirely. Detected and skipped the same way here.
name: Claude Code Review (on-demand)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required for OIDC authentication to the Claude GitHub app — the same
  # gap that silently broke claude-review.yml's automatic pass (see that
  # file's own comment on this permission).
  id-token: write

jobs:
  review:
    # issue_comment fires for both issues and PRs; only react on PRs.
    # pull_request_review_comment only ever fires on PRs, so it always
    # passes. The startsWith check is the trigger phrase (see file header).
    # The actor-association check is the secrets-exposure gate (see file
    # header, point 1) — anyone able to comment on a public repo can
    # otherwise trigger this and spend the repo owner's Claude usage.
    if: >
      (github.event_name == 'pull_request_review_comment' ||
       github.event.issue.pull_request != null) &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association)
    # One on-demand review per PR at a time; a second "/review" cancels the
    # run in flight instead of stacking another full review on top. Set on
    # the job, not the workflow, so a comment the `if:` skips never joins
    # the group and can't cancel a real run.
    concurrency:
      group: claude-review-on-demand-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # issue_comment's payload has no github.event.pull_request — only
      # github.event.issue.number (issues and PRs share the same numbering).
      # pull_request_review_comment does carry github.event.pull_request
      # directly. Normalized here so later steps don't need to branch on
      # event type again.
      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      # Fork-PR gate (see file header, point 2). gh pr view's
      # isCrossRepository field is true exactly when the PR head lives in a
      # different repo (i.e. a fork) than this one.
      - name: Detect fork PR (untrusted diff content — see file header)
        id: fork_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_fork=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json isCrossRepository -q .isCrossRepository)
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"

      - name: Note skip on fork PR
        if: steps.fork_check.outputs.is_fork == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" \
            --body "/review skipped: this PR is from a fork. On-demand review only runs against PRs from this repository, to avoid feeding untrusted diff content to a workflow step with write permissions."

      - name: Checkout PR
        if: steps.fork_check.outputs.is_fork == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Run Claude Code review (local /code-review, on demand)
        if: steps.fork_check.outputs.is_fork == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments:*)"
          prompt: |
            Review this pull request's diff for correctness bugs and
            reuse/simplification/efficiency issues, per this repo's
            code-review conventions (see /code-review skill and
            DOC/architecture/clean_code_rules.md).

            Post at most 10 findings, as inline PR review comments, one
            comment per issue. Before posting anything:
            - Verify each finding against the code it cites; drop any you
              can't confirm.
            - Merge duplicates: an issue that shows up in several places is
              one comment, which names the other places.
            - Skip any issue that already has a review comment on this PR
              (list them with `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments --paginate`).
            If more than 10 survive, keep the 10 most severe. Do not post a
            summary comment. Do not approve or request changes on the PR
            itself — this review is advisory only (AW-13); a human retains
            merge authority.
